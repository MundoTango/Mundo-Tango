# Mundo Tango - Customer Journey: Mr. Blue AI Chat
# Records interaction with Mr. Blue AI assistant
id: mr-blue-chat
name: Mr. Blue AI Assistant Journey
description: Meet Mr. Blue - your personal tango AI companion who helps you discover events, find partners, and plan your tango journey
type: customer
startPath: /mr-blue

viewport:
  width: 1280
  height: 720

steps:
  - action: wait
    delay: 2500
    description: Show Mr. Blue interface

  - action: scroll
    value: "200"
    delay: 1000
    description: View Mr. Blue features

  - action: wait
    delay: 1500
    description: Display AI capabilities

  - action: click
    target: '[data-testid="mr-blue-chat-input"]'
    delay: 500
    description: Focus chat input

  - action: type
    target: '[data-testid="mr-blue-chat-input"]'
    value: "Help me find tango events in Buenos Aires"
    delay: 2000
    description: Type a question to Mr. Blue

  - action: wait
    delay: 2000
    description: Show the typed message

  - action: scroll
    value: "100"
    delay: 1000
    description: Scroll to see more

  - action: wait
    delay: 2000
    description: Final view of Mr. Blue

output:
  filename: mr-blue-chat.mp4
  format: mp4
  thumbnail: true

metadata:
  duration: "~14 seconds"
  category: ai-assistant
  tags:
    - ai
    - assistant
    - mr-blue
    - chat
    - help
  marketingUse: true
  facebookOptimized: true
