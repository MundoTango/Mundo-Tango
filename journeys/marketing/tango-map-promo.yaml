# Mundo Tango - Marketing Journey: Tango Map Promo
# Faceless content for Facebook/social media marketing
id: tango-map-promo
name: Global Tango Map Promo
description: Promotional video showcasing the interactive global tango map with city markers
type: marketing
startPath: /

viewport:
  width: 1080
  height: 1920

steps:
  - action: wait
    delay: 1500
    description: Opening shot of landing page

  - action: scroll
    value: "800"
    delay: 2000
    description: Scroll to map section

  - action: wait
    delay: 2000
    description: Show the global tango map

  - action: scroll
    value: "200"
    delay: 1500
    description: Highlight map details

  - action: wait
    delay: 2000
    description: Display city markers

  - action: scroll
    value: "-200"
    delay: 1000
    description: Pan back

  - action: wait
    delay: 2000
    description: Final map view

output:
  filename: tango-map-promo.mp4
  format: mp4
  thumbnail: true

metadata:
  duration: "~15 seconds"
  category: promotional
  tags:
    - map
    - global
    - cities
    - promo
  marketingUse: true
  facebookOptimized: true
