# Mundo Tango - Marketing Journey: Community Showcase
# Faceless content highlighting the tango community features
id: community-showcase
name: Community Features Showcase
description: Promotional video showcasing groups, connections, and community features
type: marketing
startPath: /

viewport:
  width: 1080
  height: 1920

steps:
  - action: wait
    delay: 1500
    description: Opening shot

  - action: scroll
    value: "600"
    delay: 1500
    description: Scroll to features section

  - action: wait
    delay: 2000
    description: Show community features

  - action: scroll
    value: "400"
    delay: 1500
    description: Continue to more features

  - action: wait
    delay: 2000
    description: Display connection features

  - action: scroll
    value: "300"
    delay: 1500
    description: Show more content

  - action: wait
    delay: 2000
    description: Final feature display

output:
  filename: community-showcase.mp4
  format: mp4
  thumbnail: true

metadata:
  duration: "~14 seconds"
  category: promotional
  tags:
    - community
    - groups
    - connections
    - social
  marketingUse: true
  facebookOptimized: true
