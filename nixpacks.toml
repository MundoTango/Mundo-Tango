# Nixpacks configuration for Railway deployment
# This overrides auto-detection to use the correct build script

[phases.setup]
nixPkgs = ["nodejs_20", "ffmpeg", "imagemagick"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
# Use the shell build script directly, not via Turbo
cmds = ["bash scripts/build.sh"]

[start]
# Memory optimization: V8 GC tuning for Railway's limited heap (~176MB)
# --max-old-space-size=256: Tell V8 about memory constraint → more aggressive GC
# --optimize-for-size: Prefer memory efficiency over raw speed
# --gc-interval=100: Run GC more frequently to reclaim memory
cmd = "NODE_OPTIONS='--max-old-space-size=256 --optimize-for-size --gc-interval=100' npm run start"
